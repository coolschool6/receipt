<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Receipts - Israel's Receipts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>All Receipts</h1>
        <nav>
            <a href="index.html">Create New Receipt</a>
        </nav>
    </header>
    <main class="container">
        <table class="receipt-table">
            <thead>
                <tr>
                    <th>Receipt ID</th>
                    <th>Date</th>
                    <th>Customer Name</th>
                    <th>Amount</th>
                    <th>Payment Method</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="receiptsList"></tbody>
        </table>
        <div id="noReceiptsMessage" style="display: none;">No receipts found.</div>
    </main>

    </footer>
    <script src="receipts.js"></script>

</html>
